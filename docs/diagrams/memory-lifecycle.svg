<text x="24" y="230" font-size="10.5" text-anchor="start" fill="currentColor" font-family="IBM Plex Sans, system-ui, sans-serif" opacity="0.65">and within the hour the compact flow rewrites [PHI&#x27;S SYNTHESIZED IMPRESSION OF @h] from the new active set.</text>
<text x="24" y="252" font-size="11" text-anchor="start" fill="currentColor" font-family="IBM Plex Sans, system-ui, sans-serif" font-weight="600" opacity="0.7">THE HIGH-WATER MARK</text>
<text x="24" y="268" font-size="10.5" text-anchor="start" fill="currentColor" font-family="IBM Plex Sans, system-ui, sans-serif" opacity="0.7">“unprocessed” = created after the namespace&#x27;s latest active observation. the mark is the only bound; it moves when extraction writes.</text>

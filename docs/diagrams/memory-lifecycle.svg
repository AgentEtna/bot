<text x="24" y="392" font-size="10.5" text-anchor="start" fill="currentColor" font-family="IBM Plex Sans, system-ui, sans-serif" opacity="0.6">until 2026-08-21 a “5 newest per namespace” read sat in front of the mark; the pass then moved the mark past what it had not read. 178 interactions were lost that way.</text>
<text x="24" y="408" font-size="10.5" text-anchor="start" fill="currentColor" font-family="IBM Plex Sans, system-ui, sans-serif" opacity="0.6">one namespace per person; the mark is per namespace.</text>
